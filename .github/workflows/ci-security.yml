name: SecureDeploy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r application/backend/requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit
        id: bandit
        continue-on-error: true
        run: bandit -r application/backend/

      - name: Run pip-audit
        id: pip_audit
        continue-on-error: true
        run: pip-audit -r application/backend/requirements.txt

      - name: Secret scan
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb  \
            detect --source=/repo --no-banner
      - name: Validate security checks
        if: always()
        run: |
          if [[ "${{ steps.bandit.outcome }}" != "success" ]] || \
             [[ "${{ steps.pip_audit.outcome }}" != "success" ]] || \
             [[ "${{ steps.gitleaks.outcome }}" != "success" ]]; then
            echo "Security checks failed. Integration is blocked."
            exit 1
          fi

  # infrastructure-security:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

  #     - name: Checkov
  #       uses: bridgecrewio/checkov-action@REPLACE_WITH_VERIFIED_FULL_SHA
  #       with:
  #         directory: infrastructure/terraform
  #         framework: terraform

  #     - name: Kubescape
  #       run: |
  #         # Install a pinned Kubescape CLI release.
  #         kubescape scan \
  #           framework nsa \
  #           kubernetes/

  application-build:
    needs:
      - source-security
      # - infrastructure-security

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build application image
        id: build
        run: |
          docker build \
            -t securedeploy-api:${GITHUB_SHA} \
            application/backend/

      - name: Trivy scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: securedeploy-api:${{ github.sha }}
          version: v0.68.2
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Generate SBOM
        id: sbom
        continue-on-error: true
        run: |
          syft securedeploy-api:${GITHUB_SHA} \
            -o cyclonedx-json=sbom.json

      - name: Upload SBOM
        id: upload_sbom
        if: always() && steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: securedeploy-sbom
          path: sbom.json

      - name: Validate security results
        if: always()
        run: |
          if [[ "${{ steps.build.outcome }}" != "success" ]] || \
            [[ "${{ steps.trivy.outcome }}" != "success" ]] || \
            [[ "${{ steps.sbom.outcome }}" != "success" ]] || \
            [[ "${{ steps.upload_sbom.outcome }}" != "success" ]]; then
            echo "Security pipeline failed. Integration is blocked."
            exit 1
          fi

          echo "All security checks passed!"