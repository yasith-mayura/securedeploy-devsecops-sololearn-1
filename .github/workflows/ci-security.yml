name: SecureDeploy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python setup
        uses: actions/setup-python@REPLACE_WITH_VERIFIED_FULL_SHA
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r application/requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit
        run: bandit -r application/

      - name: Run pip-audit
        run: pip-audit -r application/requirements.txt

      - name: Secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:REPLACE_WITH_PINNED_VERSION \
            detect --source=/repo --no-banner

  infrastructure-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkov
        uses: bridgecrewio/checkov-action@REPLACE_WITH_VERIFIED_FULL_SHA
        with:
          directory: infrastructure/terraform
          framework: terraform

      - name: Kubescape
        run: |
          # Install a pinned Kubescape CLI release.
          kubescape scan \
            framework nsa \
            kubernetes/

  application-build:
    needs:
      - source-security
      - infrastructure-security

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build application image
        run: |
          docker build \
            -t securedeploy-api:${GITHUB_SHA} \
            application/

      - name: Trivy scan
        run: |
          # Install a pinned Trivy CLI release.
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            securedeploy-api:${GITHUB_SHA}

      - name: Generate SBOM
        run: |
          # Install a pinned Syft CLI release.
          syft securedeploy-api:${GITHUB_SHA} \
            -o cyclonedx-json=sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@REPLACE_WITH_VERIFIED_FULL_SHA
        with:
          name: securedeploy-sbom
          path: sbom.json
